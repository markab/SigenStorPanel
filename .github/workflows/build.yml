name: build

# SigenStorPuck's pipeline, for the panel:
#
# - Every push and pull request builds the firmware and the simulator, so breakage
#   is caught without hardware.
# - A push to main also packages the firmware and, once Pages is switched on (see
#   the pages job), publishes the web installer with the firmware beside it. The
#   panel's updater reads the same manifest, so this is also how updates reach
#   panels already in use.
# - A v* tag additionally cuts a GitHub Release with the images attached. The tag
#   must match PUCK_FW_VERSION in src/board_config.h, or packaging fails.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to create the release on a tag.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The ESP32-P4 toolchain is several hundred megabytes and the platform pulls
      # more; without this every run spends most of its time downloading. The
      # panel keeps its own PlatformIO core (core_dir in platformio.ini), so that
      # is the directory cached, not ~/.platformio.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio-sigenstorpanel
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio esptool

      - name: Build firmware
        run: pio run -e panel

      # On tags this feeds the release; on main it feeds the installer page.
      - name: Package artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./tools/package_release.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # One OTA image and one whole-flash image per board. A Release's asset
          # namespace is flat, so these carry the slug in the name; the manifest
          # lives on Pages next to its merged.bin.
          files: |
            dist/firmware-*.bin
            dist/merged-*.bin
          generate_release_notes: true

      # Handed to the pages job, which cannot see this job's workspace.
      - name: Keep artifacts for the installer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  # A job of its own, so a simulator problem never holds up a firmware release.
  # Worth building on every push all the same: the simulator shares the snapshot
  # model, the parsers and every screen with the firmware, and --selftest runs the
  # checks that need no hardware.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio-sigenstorpanel
            ~/.cache/pip
          key: pio-sim-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-sim-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # SDL2 for the window, libcurl for --live.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev

      - name: Build simulator
        run: pio run -e sim

      - name: Self-tests
        env:
          SDL_VIDEODRIVER: dummy
        run: .pio/build/sim/program --selftest

  # Publishes the installer to Pages, with the firmware alongside it.
  #
  # Off until two things are set on GitHub, neither of which can be set from here:
  #
  #   Settings > Pages > Source: GitHub Actions
  #     Otherwise Pages serves README.md through Jekyll and the installer is never
  #     published, which looks like the install link reloading the page.
  #
  #   Settings > Secrets and variables > Actions > Variables: PAGES_ENABLED = true
  #     The switch for this job. Without it every push to main would fail here
  #     until Pages exists.
  #
  # Pages for a private repository needs a paid GitHub plan; the published site is
  # public either way, which is the point: the panel's updater fetches from it
  # without a token.
  #
  # Deploys from main rather than from a tag, as SigenStorPuck does. The
  # github-pages environment is created restricted to branches, and allowing a tag
  # there needs a rule whose ref type is Tag rather than Branch, an easy thing to
  # set wrongly. main is allowed by default, so this needs no environment rule.
  #
  # The cost is that the installer flashes the tip of main rather than the newest
  # tagged release. The panel's updater reads the same manifest from Pages
  # (SigenStorPanel/<slug>/manifest.json), so the installer and updates stay in
  # step: both advertise whatever main's PUCK_FW_VERSION says. The version bump is
  # the gate; pushing to main without one publishes nothing a panel will install.
  #
  # The page and the binary it flashes have to be served from the same origin:
  # GitHub release assets send no CORS header, so a page fetching them from
  # another origin is blocked and flashing never starts. That is why the firmware
  # is published here and not only on the Release.
  pages:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # A permissions block replaces the defaults rather than adding to them, so
      # contents: read has to be spelled out. Without it actions/checkout cannot
      # read a private repository and fails with "repository not found", which
      # reads like the repo is missing rather than like a permissions problem.
      contents: read
      # download-artifact reads this run's artifacts through the Actions API.
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the firmware built above
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: web/installer

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/installer
      - id: deploy
        uses: actions/deploy-pages@v4
