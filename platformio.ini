; SigenStorPanel: firmware for the Elecrow CrowPanel Advanced 10.1" ESP32-P4 HMI.
;
; A SKETCH, NOT YET BUILT. Making this build is Phase 0a in docs/PLAN.md; the
; values below are the decisions already taken (see CLAUDE.md, "Toolchain
; decisions"), not tested configuration.
;
; Environments:
;   panel   the 10.1" board, flashed over the CH341 (UART0)
;   sim     SDL desktop build at 1024x600, needs SDL2 (brew install sdl2)

[platformio]
default_envs = panel
; This repo's own toolchain. ~/.platformio is shared with SigenStorPuck, which is
; pinned to an older Arduino core, and the two would keep replacing each other's
; framework package. Expect the first build to download ~1 GB here.
core_dir = ~/.platformio-sigenstorpanel

[env:panel]
; pioarduino 55.03.38-1 = Arduino-ESP32 3.3.8. Needed for hostedSetPins() and
; esp-hosted 2.x: this board's SDIO wiring to the C6 is not the default that
; 3.1.x has compiled in (docs/HARDWARE.md).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
; For silicon below revision 3.0. A rev 3 part needs esp32-p4_r3.
board = esp32-p4
framework = arduino

; The board definition claims 4 MB of flash; this board has 16 MB. The stock
; 16 MB table gives two ~6.5 MB app slots, so a failed OTA rolls back. PSRAM is
; hex mode on the P4, so none of the S3's qio_opi / opi settings belong here.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D BOARD_HAS_PSRAM
	; Serial is UART0 through the CH341, so no USB-CDC flags.
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src
	-I src/ui

build_src_filter = +<*> -<sim/>

lib_deps =
	lvgl/lvgl@8.4.0
	; 1.6.4 fails on core 3.3 (found in claude-gadget). Has Arduino_DSI_Display.
	moononournation/GFX Library for Arduino@1.6.8
	; GT911 touch (TouchDrvGT911).
	lewisxhe/SensorLib@0.4.1
	bblanchon/ArduinoJson@^7
	; 2.0.17 is the first release that works with Arduino-ESP32 3.x.
	https://github.com/tzapu/WiFiManager.git#v2.0.17

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; -----------------------------------------------------------------------------
; Desktop simulator. Same LVGL, same lv_conf.h, same screens, same parsers; only
; the display and input backends differ. Its size comes from the board profile.
;
;   pio run -e sim && .pio/build/sim/program
[env:sim]
platform = native

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src
	-I src/ui
	-D SDL_MAIN_HANDLED
	!sdl2-config --cflags
	!sdl2-config --libs

; src/device/ is WiFi, NVS and HTTP: Arduino-only. The hardware backends
; (display_dsi.cpp, touch_gt911.cpp, once written) must be excluded here too.
build_src_filter = +<*> -<main.cpp> -<device/>

lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7
